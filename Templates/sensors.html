<head>

<script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
   

    const firebaseConfig = { //Configuration to be able to retrieve from the Firesroew 

        apiKey: "AIzaSyCVDRhmU_ps8O0GNI9FjqmR6oh67ariS3s",
        authDomain: "eirq-solutions.firebaseapp.com",
        databaseURL: "https://eirq-solutions-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "eirq-solutions",
        storageBucket: "eirq-solutions.appspot.com",
        messagingSenderId: "931290153741",
        appId: "1:931290153741:web:d8edcb6428ff83a5352644",
        measurementId: "G-KRKNJRRQMY"

    };
        //
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "Sensors", "qgAUiAbZQNU4JFX5o9Bp"); // Construct Document references

        async function fetchData() {
        try {
            const docSnap = await getDoc(docRef); // Fetch from Firetsore
            const data = docSnap.data(); // Retrieve document data
            displayData(data); // Display retrieved sensor data
        } catch (error) {
            console.error("Error fetching document:", error);
        }
    }

    function displayData(data) {
        // Display the retrieved data in the HTML element
        const messagesContainer = document.getElementById("smessages");
        messagesContainer.innerHTML = `
            <p style="display: flex; flex-direction: column; align-items: center;">
                SensorNo: ${data.SensorNo}, 
                SerialNo: ${data.SerialNo}, 
                ProductID: ${data.ProductID}, 
                Serviced: ${data.Serviced}
            </p>`;
    }

    const fetchDataBtn = document.getElementById("fetchDataBtn");
    fetchDataBtn.addEventListener("click", fetchData); // Add click event listener to fetch data button
</script>

<body class="sensor-page">

<!-- Filters for Warning Level and Date Ranges -->
<div class="container mt-3">
    <div class="row">
        <div class="col-md-6">
            <select class="form-select" id="warningLevel">
                <option value="">Select Warning Level</option>
                <option value="0">Good ECO2</option>
                <option value="1">Bad ECO2</option>
                <option value="2">Dangerous ECO2</option>
            </select>
        </div>
        <div class="col-md-6">
            <select class="form-select" id="dateRange">
                <option value="">Select Date Range</option>
                <option value="Yesterday">Yesterday</option>
                <option value="3daysAgo">3 or more days ago</option>
                <option value="LastWeek">Last week</option>
                <option value="LastMonth">Last month</option>
            </select>
        </div>
    </div>
</div>


<div class="container custom-mt-5">
    <div class="row justify-content-center">
        <!-- Sensor Live Container -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-body custom-color2">
                    <h5 class="card-title text-center mb-4 custom-color2 display-6 fw-normal">Sensor - Live</h5>
 
                    <div id="messages" class="main_container" style="background-color: transparent; text-align: center; overflow-y: auto; max-height: 400px;">
                        {% for msg in data[::-1] %}
                            <div class="sensor-info" data-date="{{ msg.date }}" data-warning="{{ msg.warning_level }}">
                                <p class="sensor-data">Date/Time: {{ msg.current_time1 }}, Temperature: {{ msg.temperature }}°C, eCO2: {{ msg.eCO2 }} ppm</p>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
        <!-- Sensor Info Container -->
        <div class="col-md-6">
            <div class="card custom-card-opacity">
                <div class="card">
                    <h5 class="card-title text-center mb-4 custom-color2 display-6 fw-normal">MySenor Info</h5>
                    <div id="smessages" class="main_container" style="background-color: transparent; text-align: center; overflow-y: auto; max-height: 400px;">
                        <button id="fetchDataBtn" class="btn btn-primary mt-3"> Check</button>     
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal for Dangerous eCO2 Level -->
<div class="modal modal-bottom-right" id="dangerousLevelModal" tabindex="-1" aria-labelledby="dangerousLevelModalLabel" aria-hidden="true" data-bs-backdrop="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="dangerousLevelModalLabel">Dangerous eCO2 Level</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Warning: Dangerous eCO2 level detected!</p>
            </div>
        </div>
    </div>
</div>

<br> 
 
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script> <!-- Include jQuery -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
 
<script>
    $(document).ready(function () {
        // Function to filter data based on selected options
        function filterData() {
            var warningLevel = $('#warningLevel').val();
            var dateRange = $('#dateRange').val();
            var currentDate = new Date();
 
            $('.sensor-info').hide(); // Hide all sensor info initially
 
            // Show sensor info based on selected filter options
            $('.sensor-info').each(function () {
                var date = new Date($(this).data('date'));
                var warning = $(this).data('warning');
 
                var diffDays = Math.floor((currentDate - date) / (1000 * 60 * 60 * 24)); // Calculate difference in days
 
                if ((warningLevel === '' || warning == warningLevel) &&
                    (dateRange === '' ||
                        (dateRange === 'Yesterday' && diffDays === 1) ||
                        (dateRange === '3daysAgo' && diffDays >= 3) ||
                        (dateRange === 'LastWeek' && diffDays <= 7) ||
                        (dateRange === 'LastMonth' && diffDays <= 30))) {
                    $(this).show();
                }
            });
 
            // Show modal if warning level is 1 or if no filter is selected
            if (warningLevel === '1' || (warningLevel === '' && dateRange === '')) {
                $('#dangerousLevelModal').modal('show');
            } else {
                $('#dangerousLevelModal').modal('hide');
            }
        }
 
        // Call filterData function when filter dropdowns change
        $('#warningLevel, #dateRange').change(filterData);
 
        // Initial data filtering when page loads
        filterData();
    });
</script>
