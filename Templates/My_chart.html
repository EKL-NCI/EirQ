<footer>

   
    <script>
      
            var data = {
                labels: [0],
                datasets: [
                    {
                    label: 'eC02',
                    data: [0], // Initial sample data
                    backgroundColor: 'rgba(0, 255, 0, 1)', // Green
                    lineTension: 0.5,
                    borderColor: 'rgba(0, 255, 0, 1)'
                  
                }
            ]
        };

        var config = {
            type : 'line',
            data : data,
        };


        var airQualityChart = new Chart(
            document.getElementById('airQualityChart'),
            config
        );

        window.setInterval(mycallback,2000);

        function mycallback() {
            var now =  new Date();
            now = now.getHours() + ":" + now.getMinutes()+ ":" + now.getSeconds();
            var value = Math.floor(Math.random()*500);
            if(data.datasets[0].data.length>=10){
                data.labels.shift();
                data.datasets[0].data.shift();

        }
            data.labels.push(now); 
            data.datasets[0].data.push(value);
            airQualityChart.update();
           // $('footer').html(now + " " + value + " ppm");
        }
    </script>
