<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='css/Styles.css')}}">
    <title>Signup</title>
</head>

<style>
.signup-page {
    background-image: url("{{ url_for('static', filename='img/skybg.png') }}"); 
    background-position: center;
}
</style>

<body class="signup-page">

    <nav class="navbar navbar-dark custom-bg-color" aria-label="label">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample01" aria-controls="navbarsExample01" aria-expanded="true" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand mx-auto" href="#">
                <img src="{{url_for('static', filename='img/logoFull1.png')}}" alt="logo" width="180"  class="rounded">
            </a>
            <div class="navbar-collapse collapse" id="navbarsExample01" style>
                <ul class="navbar-nav me-auto mb2">
                    <li class="nav-item"><a class="nav-link" aria-current="page" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" aria-current="page" href=/Login>Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    



    <div class="container custom-mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body custom-color2">
                        <h5 class="card-title text-center mb-4 custom-color2 display-6 fw-normal">Signup</h5>

                        <form action="/Signup" method="POST">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="businessName" class="form-label">Business Name</label>
                                <input type="text" class="form-control" id="businessName" name="business-name" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="user_pwd0" required>
                            </div>
                            <div class="mb-3">
                                <label for="txtconfirmpassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="password" name="user_pwd1" required >
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary btn-signup">Signup</button>
                            </div>
                            <div class="text-center">
                                <a href="/Login" class="text-decoration-none">Already have an account? Log in Here</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {% if error_message %} <!-- Display mesaage if triggered - Morris -->
    <div class="alert alert-danger alert-dismissible fade show custom-alert" role="alert">
        {{ error_message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    {% if exist_message %} <!-- Display mesaage if triggered - Morris -->
    <div class="alert alert-danger alert-dismissible fade show custom-alert" role="alert">
        {{ exist_message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    <br>
    <br>
    <br>
    <br>
    <br>

    {% if exist_message %}
    <script> //Morris Js 
        setTimeout(function() {   // If user gets error message they will be automaticallly moved to Login page in 6s
            window.location.href = "/Login";
        }, 6000); // Redirect after 6 seconds (6000 milliseconds)
    </script>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>

</html>
