<!DOCTYPE html>
<html lang="en">
<head>
    <title>Verification</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nova+Square&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static', filename='css/Styles.css')}}">
</head>

<style>
    .verify-page {
        background-image: url("{{ url_for('static', filename='img/skybg.png') }}"); 
        background-position: center;
    }
</style>

<body class="verify-page">

    <nav class="navbar navbar-dark bg-dark" aria-label="label">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample01" aria-controls="navbarsExample01" aria-expanded="true" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand mx-auto" href="#">
                <img src="{{url_for('static', filename='img/logoFull1.png')}}" alt="logo" width="180"  class="rounded">
            </a>
            <div class="navbar-collapse collapse" id="navbarsExample01" style>
                <ul class="navbar-nav me-auto mb2">
                    <li class="nav-item"><a class="nav-link" aria-current="page" href="/">Main</a></li>
                    <li class="nav-item"><a class="nav-link" aria-current="page" href=/Login>Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container custom-mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card custom-card-opacity">
                    <div class="card-body custom-color2">
                        <h5 class="card-title text-center mb-4 custom-color2 display-6 fw-normal">Verify Email</h5>
                        <p class="increase-text-size">An email has been sent to {{ email }}. Please check your inbox to verify your email address. Click refresh or go to login when verified</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center">
            <button type="submit" class="btn btn-primary btn-login">Refresh</button>
    </div>              
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
